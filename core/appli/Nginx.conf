server {
    listen 80;
    server_name kmr.are.site 148.230.112.173;

    # 🧊 Fichiers statiques Django & React
    location /static/ {
        alias /home/app/web/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /home/app/web/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 🔀 Proxy vers Django backend (API, admin, auth, etc.)
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /auth/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /care/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 🧭 Vue React single-page fallback
    location / {
        root /home/app/web/staticfiles;
        index index.html;
        try_files $uri /index.html;
    }
}