version: "3.9"

networks:
  app-network:
    driver: bridge

services:
  web:
    build: .
    container_name: kmrcare
    volumes:
      - enkostatics:/app/staticfiles
      - enkomedia:/app/media
    ports:
      - "8000:8000"
    networks:
      - app-network
    depends_on:
      - db
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=postgres

  db:
    image: postgres:latest
    container_name: kmrcare_db
    environment:
      POSTGRES_PASSWORD: 1234
    volumes:
      - kmrcare-db:/var/lib/postgresql/data/
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: kmrcare-nginx
    volumes:
      - kmrcarestatics:/home/app/web/staticfiles
      - kmrcaremedia:/home/app/web/media
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
    networks:
      - app-network
    ports:
      - "80:80"

volumes:
  kmrcare-db:
  kmrcaremedia:
  kmrcarestatics:
